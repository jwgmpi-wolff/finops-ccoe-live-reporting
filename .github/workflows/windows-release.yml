name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example, v1.0.0)"
        required: true
        default: "v1.2.2"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and test Windows packages
        shell: pwsh
        run: .\build-windows.ps1

      - name: Package portable application and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\FinOpsCCoE\*" -DestinationPath ".\dist\FinOpsCCoE-portable.zip" -CompressionLevel Optimal
          $assets = @(
            ".\dist\installer\FinOpsCCoE-Setup.exe",
            ".\dist\FinOpsCCoE-portable.zip"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -Path ".\dist\SHA256SUMS.txt" -Encoding ascii

      - name: Retain workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinOpsCCoE-Windows-${{ env.RELEASE_TAG }}
          path: |
            dist/installer/FinOpsCCoE-Setup.exe
            dist/FinOpsCCoE-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            ".\dist\installer\FinOpsCCoE-Setup.exe",
            ".\dist\FinOpsCCoE-portable.zip",
            ".\dist\SHA256SUMS.txt"
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "FinOps CCoE $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub release $env:RELEASE_TAG."
          }