  <text x="770" y="195" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#1f4d68">Azure Deployment</text>
  <text x="770" y="235" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#4f6b7d">deploy-azure.ps1 provisions App Service + zip deploy</text>
