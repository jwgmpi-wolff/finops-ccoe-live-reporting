  <text x="80" y="90" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">FinOps CCoE Live Reporting - Dashboard</text>

  <rect x="70" y="140" width="360" height="220" rx="10" fill="#ffffff" stroke="#c6d6e3" />
