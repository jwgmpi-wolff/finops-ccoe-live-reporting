  <text x="480" y="250" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#415a6b">93 subscriptions available</text>

  <rect x="910" y="140" width="420" height="220" rx="10" fill="#ffffff" stroke="#c6d6e3" />
