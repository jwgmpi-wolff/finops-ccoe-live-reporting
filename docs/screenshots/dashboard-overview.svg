  <text x="90" y="220" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#415a6b">Sign In with Entra</text>
  <text x="90" y="250" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#415a6b">Use Azure CLI Session</text>

  <rect x="460" y="140" width="420" height="220" rx="10" fill="#ffffff" stroke="#c6d6e3" />
  <text x="480" y="180" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#10384f">Tenant and Subscription Scope</text>
